<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#292f39"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="application-name" content="BemRápido"><title>BemRápido</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css?v=13"></head><body><main id="game"><canvas id="city" aria-label="Pista livre de carrinhos de brinquedo"></canvas><div id="controls"><button id="honk" aria-label="Buzinar duas vezes"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 13h8l10-6v18l-10-6H7zM7 14H3v4h4m9 1-2 8h-5l2-8M28 12q4 4 0 8"/></svg></button><button id="music-toggle" aria-label="Música desligada. Ativar eletrônica" data-mode="off"><span aria-hidden="true">♫</span><small id="music-state">OFF</small></button></div><dialog id="menu"><div class="menu-head"><h1>Configurações</h1><button id="close" aria-label="Fechar menu">×</button></div><label for="car-size">Tamanho dos carrinhos <output id="size-value">100%</output></label><input id="car-size" type="range" min="40" max="100" value="100" step="5"><label for="car-count">Carrinhos na pista</label><select id="car-count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><label for="traffic-speed">Velocidade dos carros <output id="speed-value">100%</output></label><input id="traffic-speed" type="range" min="25" max="175" step="5" value="100"><fieldset id="models"><legend>Modelos na pista</legend><label><input id="model-car" type="checkbox" checked> Carros normais</label><label><input id="model-pickup" type="checkbox"> Caminhonetes</label><label><input id="model-bus" type="checkbox"> Ônibus</label><label><input id="model-truck" type="checkbox"> Caminhões</label></fieldset><label class="setting" for="effects">Motor e buzina<input id="effects" type="checkbox" checked></label><label for="music">Música</label><select id="music"><option value="off">Sem música</option><option value="electronic">Eletrônica animada</option><option value="rock">Rock de garagem</option></select><label for="music-volume">Volume da música</label><input id="music-volume" type="range" min="0" max="100" value="35"><button id="install" hidden>Instalar BemRápido</button><button id="back">Voltar</button></dialog></main><script src="game.js?v=13"></script></body></html>
